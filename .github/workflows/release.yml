name: Publish Docker image
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./server/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-psu:latest
  touch-k8s-manifest:
    needs: [ push_to_registry ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release branch
        run: |
          git config --global user.name 'Release Runner'
          git config --global user.email 'runner@users.noreply.github.com'
          # служебная ветка release: создаём при первом запуске, дальше только обычные (fast-forward) push
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git checkout -B release origin/release
            git merge --no-edit -X theirs origin/main
          else
            git checkout -b release
          fi
      - name: Insert release date
        run: 'sed -i "s/release-date: .*$/release-date: s`date +%s`/g" ./server-k8s-manifests/devops-psu.yml'
      - name: Commit manifest
        run: |
          git commit -am "Release"
          git push origin release
